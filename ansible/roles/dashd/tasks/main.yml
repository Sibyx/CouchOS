- name: Check the dashd build exists (dashd/build.sh)
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ dashd_dist }}"
  register: dashd_binary
  failed_when: not dashd_binary.stat.exists

# A build older than its sources once shipped a dashd that served other keys
# than the skin binds (the TV's daily forecast went blank). Rebuild first.
- name: Check the dashd build is newer than its sources
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../dashd/src"
    patterns: ["*.rs"]
    recurse: true
  register: dashd_sources
  failed_when: >-
    dashd_sources.files | selectattr('mtime', 'gt', dashd_binary.stat.mtime) | list | length > 0

- name: dashd directory
  ansible.builtin.file:
    path: /opt/couchos/dashd
    state: directory
    mode: "0755"

- name: dashd binary
  ansible.builtin.copy:
    src: "{{ dashd_dist }}"
    dest: /opt/couchos/dashd/dashd
    mode: "0755"
  notify: Restart dashd

- name: dashd config
  ansible.builtin.template:
    src: dashd.json.j2
    dest: /opt/couchos/dashd/dashd.json
    mode: "0644"
  notify: Restart dashd

- name: dashd user service
  ansible.builtin.template:
    src: dashd.service.j2
    dest: "{{ tv_home }}/.config/systemd/user/dashd.service"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart dashd

- name: Start dashd
  become_user: "{{ tv_user }}"
  environment: "{{ tv_env }}"
  ansible.builtin.systemd_service:
    name: dashd.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
