[package]
name = "dashd"
version = "0.4.0"
edition = "2024"
description = "CouchOS dashboard daemon: widget data for the TV and the phone"
license = "MIT"
publish = false

[dependencies]
# Kept deliberately small: every crate here ends up in RAM on a 1 GB Pi 3.
libc = "0.2"
# The duck and the QR code are SVG, rasterized here because Kodi cannot
# draw SVG. No text, fonts or embedded images: shapes only.
qrcodegen = "1.8"
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
