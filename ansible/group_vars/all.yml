# CouchOS configuration. Everything the roles need is set here.

# --- network / mDNS ----------------------------------------------------------
# Hostname = inventory name (beelzebub-tv) -> beelzebub-tv.local
mdns_interfaces: [eth0]

# --- media user --------------------------------------------------------------
# Kodi, UxPlay, PipeWire, couchd and the web container all run as this user's
# systemd --user services (lingering, no login session).
tv_user: tv

# --- storage (1 TB HDD) ------------------------------------------------------
# Find the device with:  ls -l /dev/disk/by-id/ | grep usb
storage_device: ""            # e.g. /dev/disk/by-id/usb-WD_Elements_..-0:0
storage_label: couchmedia
storage_mount: /srv/media
storage_dirs: [Videos, Music, Photos]
# Formatting is destructive. It only runs when storage_format is true AND
# storage_format_confirm repeats storage_device exactly:
#   ansible-playbook site.yml -e storage_format=true -e storage_format_confirm=/dev/disk/by-id/...
storage_format: false
storage_format_confirm: ""
storage_spindown_seconds: 600

# --- Kodi --------------------------------------------------------------------
# Raspberry Pi archive build (Pi-patched V4L2/DRM-PRIME decode).
# On 2026-11-21 the archive had kodi 21.3+rpt3 and kodi22 22.0~beta2+rpt1.
# To try Kodi 22: kodi_package: kodi22, and point kodi_binary at its launcher
# (check on the Pi with: dpkg -L kodi22 | grep bin/).
kodi_package: kodi
kodi_binary: /usr/bin/kodi
kodi_audio_backend: pulseaudio   # PipeWire's pulse server
kodi_webserver_port: 8080

# Picture quality, enforced over JSON-RPC on every run (Kodi owns
# guisettings.xml). Already right by default on this build: GUI rendered at
# 1080 (limitguisize 3), DRM PRIME "Direct To Plane" video (hardware plane,
# display scaler, no GL copy), 1920x1080@60 RGB 8-bit output.
kodi_settings:
  # Only true 1080p modes for refresh-rate matching: no interlaced, no 720p,
  # no 29.97/30 Hz. Film plays at 23.976/24 Hz instead of 60 Hz judder.
  videoscreen.whitelist:
    - "0192001080023.97602pstd"
    - "0192001080024.00000pstd"
    - "0192001080025.00000pstd"
    - "0192001080050.00000pstd"
    - "0192001080059.94006pstd"
    - "DESKTOP"
  # 25 fps content at 50 Hz (25 Hz flickers on most TVs).
  videoscreen.whitelistdoublerefreshrate: true
  # Give the TV time to lock after a mode change (first frames are lost otherwise). Unit: 0.1 s.
  videoscreen.delayrefreshchange: 5
  videoplayer.adjustrefreshrate: 2
  # Video clock follows the display: no judder, audio resampled to match.
  videoplayer.usedisplayasclock: true
  videoplayer.useprimedecoder: true
  videoplayer.useprimerenderer: 0
  videoscreen.limitguisize: 3
pm4k_settings: "/home/{{ tv_user }}/.kodi/userdata/addon_data/script.plexmod/settings.xml"

# PM4K (PlexMod for Kodi). The upstream tags are stale; this is the
# develop_kodi21 head on 2026-11-07 (addon version 1.14.1-beta1).
pm4k_ref: 8e725ffaa4661770aaf32da01f6b1b534d59e9d0
kodi_addon_repo: https://mirrors.kodi.tv/addons/omega

# --- AirPlay (UxPlay) --------------------------------------------------------
uxplay_version: 1.73.7
airplay_name: CouchOS
# -p: fixed legacy ports (TCP 7000,7001,7100 / UDP 6000,6001,7011)
# Forward-only: -vrtp/-artp send the decrypted streams to airplay-bridge and
# Kodi plays them. UxPlay's own rendering is not used: its GStreamer V4L2
# decode crashed on the Pi 3 (bcm2835-codec "buffer size mismatch" on the
# iPhone's mirror size), while Kodi's ffmpeg V4L2 path handles 1920x886,
# portrait and rotation (verified 2026-11-21), and Kodi keeps the screen.
# The unit adds -dacp <file>: the file exists only while a client is connected,
# and couchd watches it to hand the screen from Kodi to AirPlay and back.
uxplay_args: >-
  -n {{ airplay_name }} -nh -p -nohold
  -vrtp "config-interval=1 ! udpsink host=127.0.0.1 port=5000"
  -artp "pt=96 ! udpsink host=127.0.0.1 port=5002"

# --- control plane -----------------------------------------------------------
couchd_port: 8765
# Shown on the dashboard. An iOS app can't be installed from a plain link:
# put a TestFlight invite here once there is one.
app_build_url: ""
plex_url: https://plex.nase.zbytocnosti.sk
web_port: 80
caddy_image: docker.io/library/caddy:2.10-alpine
