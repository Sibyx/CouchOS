- name: couchd
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../couchd/couchd.py"
    dest: /opt/couchos/couchd/
    mode: "0755"
  notify: Restart couchd

- name: couchd user service
  ansible.builtin.template:
    src: couchd.service.j2
    dest: "{{ tv_home }}/.config/systemd/user/couchd.service"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart couchd

- name: Start couchd
  become_user: "{{ tv_user }}"
  environment: "{{ tv_env }}"
  ansible.builtin.systemd_service:
    name: couchd.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
