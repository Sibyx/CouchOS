[package]
name = "dashd"
version = "0.1.0"
edition = "2024"
description = "CouchOS dashboard daemon: widget data for the TV and the phone"
license = "MIT"
publish = false

[dependencies]
# Kept deliberately small: every crate here ends up in RAM on a 1 GB Pi 3.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
