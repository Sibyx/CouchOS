# Kodi 22 upgrades the databases in ~/.kodi on first start, one way. Keep the
# Kodi 21 profile (Plex sign-in included) once, so going back is a restore.
- name: Back up the Kodi 21 profile before Kodi 22
  when: kodi_package == 'kodi22'
  block:
    - name: Is there a backup already
      ansible.builtin.stat:
        path: "{{ kodi_backup }}"
      register: kodi_backup_stat

    - name: Is Kodi 21 installed
      ansible.builtin.command: dpkg-query -W -f=${Status} kodi
      register: kodi21_installed
      changed_when: false
      failed_when: false

    - name: Stop Kodi and archive ~/.kodi
      when:
        - not kodi_backup_stat.stat.exists
        - "'install ok installed' in kodi21_installed.stdout"
      block:
        - name: Stop Kodi while archiving its profile
          become_user: "{{ tv_user }}"
          environment: "{{ tv_env }}"
          ansible.builtin.systemd_service:
            name: kodi.service
            scope: user
            state: stopped

        - name: Archive ~/.kodi
          community.general.archive:
            path: "{{ tv_home }}/.kodi"
            dest: "{{ kodi_backup }}"
            exclude_path:
              - "{{ tv_home }}/.kodi/temp"
            owner: "{{ tv_user }}"
            group: "{{ tv_user }}"
            mode: "0600"

- name: Install Kodi (Raspberry Pi archive build)
  ansible.builtin.apt:
    name: "{{ kodi_package }}"
    state: present
    install_recommends: false
  notify: Restart kodi

- name: Keep the login prompt off the TV (Kodi owns the screen)
  ansible.builtin.systemd_service:
    name: getty@tty1.service
    enabled: false
    state: stopped

- name: First-run settings (only if Kodi has no settings yet)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ tv_home }}/.kodi/userdata/{{ item }}"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    force: false
  loop: [guisettings.xml, sources.xml]

- name: Advanced settings
  ansible.builtin.template:
    src: advancedsettings.xml.j2
    dest: "{{ tv_home }}/.kodi/userdata/advancedsettings.xml"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart kodi

- name: CouchOS Kodi add-on
  ansible.builtin.copy:
    src: service.couchos/
    dest: "{{ tv_home }}/.kodi/addons/service.couchos/"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart kodi

# The TV dashboard, as Kodi's screensaver (data from dashd).
- name: CouchOS dashboard add-on
  ansible.builtin.copy:
    src: screensaver.couchos.dashboard/
    dest: "{{ tv_home }}/.kodi/addons/screensaver.couchos.dashboard/"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart kodi

# The Plex catalog on the TV (couchd's index, made for the remote).
- name: CouchOS catalog add-on
  ansible.builtin.copy:
    src: script.couchos.catalog/
    dest: "{{ tv_home }}/.kodi/addons/script.couchos.catalog/"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart kodi

- name: CouchOS catalog add-on, where couchd is
  ansible.builtin.template:
    src: couchos-catalog.json.j2
    dest: "{{ tv_home }}/.kodi/addons/script.couchos.catalog/resources/couchd.json"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"

- name: Keymaps directory
  ansible.builtin.file:
    path: "{{ tv_home }}/.kodi/userdata/keymaps"
    state: directory
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0755"

# Blue opens the catalog; red/green/yellow reach it as themselves.
- name: CouchOS remote keys
  ansible.builtin.copy:
    src: keymaps/couchos.xml
    dest: "{{ tv_home }}/.kodi/userdata/keymaps/couchos.xml"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart kodi

# Superseded by PM4K's kiosk mode (below); two launchers raced each other.
- name: Remove the old CouchOS autostart
  ansible.builtin.file:
    path: "{{ tv_home }}/.kodi/addons/service.couchos/service.py"
    state: absent
  notify: Restart kodi

- name: Add-on installer
  ansible.builtin.copy:
    src: kodi-addons.py
    dest: /usr/local/libexec/couchos/
    mode: "0755"

# CouchOS's changes to PM4K (pm4k-patches/*.patch, applied in name order):
# 0001 lets couchd open a Plex item picked on the phone.
# 0002 restarts a transcode resumed after a long pause (else it ends).
- name: patch (applies the PM4K patches)
  ansible.builtin.apt:
    name: patch
    state: present
    install_recommends: false

- name: PM4K patches
  ansible.builtin.copy:
    src: pm4k-patches/
    dest: /usr/local/share/couchos/pm4k-patches/
    mode: "0644"
    directory_mode: "0755"

- name: Install PM4K and its dependencies
  become_user: "{{ tv_user }}"
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/couchos/kodi-addons.py
      - install
      - --addons-dir={{ tv_home }}/.kodi/addons
      - --repo={{ kodi_addon_repo }}
      - --pm4k-ref={{ pm4k_ref }}
      - --patches=/usr/local/share/couchos/pm4k-patches
  register: pm4k_install
  changed_when: (pm4k_install.stdout | from_json).changed
  notify: Restart kodi

# inputstream.airplay (airplay_receiver: kodi), built by airplay/build.sh.
- name: AirPlay add-on
  when: airplay_receiver == 'kodi'
  block:
    - name: Check the AirPlay add-on build exists
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ airplay_addon_dist }}.tar.gz"
      register: airplay_tarball
      failed_when: not airplay_tarball.stat.exists

    # Before Kodi restarts with the add-on: UxPlay holds port 7000 and the
    # same AirPlay name (the uxplay role, later, keeps them off).
    - name: Stop UxPlay before the add-on starts
      become_user: "{{ tv_user }}"
      environment: "{{ tv_env }}"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        enabled: false
        state: stopped
      loop: [uxplay.service, airplay-bridge.service]
      failed_when: false

    - name: AirPlay add-on runtime libraries
      ansible.builtin.apt:
        name: "{{ lookup('file', airplay_addon_dist ~ '.DEPENDS').split() }}"
        state: present
        install_recommends: false

    - name: Install the AirPlay add-on
      ansible.builtin.unarchive:
        src: "{{ airplay_addon_dist }}.tar.gz"
        dest: "{{ tv_home }}/.kodi/addons/"
        owner: "{{ tv_user }}"
        group: "{{ tv_user }}"
      notify: Restart kodi

- name: Kodi user service
  ansible.builtin.template:
    src: kodi.service.j2
    dest: "{{ tv_home }}/.config/systemd/user/kodi.service"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart kodi

- name: Start Kodi
  become_user: "{{ tv_user }}"
  environment: "{{ tv_env }}"
  ansible.builtin.systemd_service:
    name: kodi.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started

- name: Apply pending Kodi restarts before enabling add-ons
  ansible.builtin.meta: flush_handlers

- name: Enable PM4K, its dependencies, the CouchOS add-ons (and AirPlay)
  become_user: "{{ tv_user }}"
  ansible.builtin.command:
    argv: "{{ enable_argv + enable_extra }}"
  vars:
    enable_argv:
      - /usr/local/libexec/couchos/kodi-addons.py
      - enable
      - --addons-dir={{ tv_home }}/.kodi/addons
      - --jsonrpc=http://127.0.0.1:{{ kodi_webserver_port }}/jsonrpc
      - --extra
      - service.couchos
      - screensaver.couchos.dashboard
      - script.couchos.catalog
    enable_extra: "{{ ['inputstream.airplay'] if airplay_receiver == 'kodi' else [] }}"
  register: pm4k_enable
  changed_when: (pm4k_enable.stdout | from_json).changed

- name: Picture quality settings
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ kodi_webserver_port }}/jsonrpc"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: Settings.SetSettingValue
      params:
        setting: "{{ item.key }}"
        value: "{{ item.value }}"
  loop: "{{ kodi_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: kodi_setting
  failed_when: kodi_setting.json.result | default(false) != true
  changed_when: false

# PM4K settings from pm4k_enforced (group_vars). The file also holds the Plex
# sign-in, so merge lines instead of templating it, and only while Kodi is
# stopped (Kodi rewrites the file on exit).
- name: Read PM4K settings
  ansible.builtin.slurp:
    src: "{{ pm4k_settings }}"
  register: pm4k_settings_raw
  failed_when: false

- name: Apply PM4K settings
  vars:
    # ['<setting id="kiosk.mode">true</setting>', ...]
    pm4k_lines: >-
      {{ pm4k_enforced.keys() | map('regex_replace', '^', '<setting id="')
         | zip(pm4k_enforced.values() | map('string') | map('lower'))
         | map('join', '">') | map('regex_replace', '$', '</setting>') | list }}
  when: >-
    pm4k_settings_raw.content is not defined or
    (pm4k_lines | reject('in', pm4k_settings_raw.content | b64decode) | list | length) > 0
  block:
    - name: Stop Kodi while editing its settings
      become_user: "{{ tv_user }}"
      environment: "{{ tv_env }}"
      ansible.builtin.systemd_service:
        name: kodi.service
        scope: user
        state: stopped

    - name: Merge settings into PM4K settings
      ansible.builtin.lineinfile:
        path: "{{ pm4k_settings }}"
        regexp: '^\s*<setting id="{{ item.key | regex_escape }}"'
        line: '    <setting id="{{ item.key }}">{{ item.value | lower }}</setting>'
        insertbefore: '^</settings>'
      loop: "{{ pm4k_enforced | dict2items }}"
      when: pm4k_settings_raw.content is defined

    - name: Create PM4K settings
      ansible.builtin.copy:
        dest: "{{ pm4k_settings }}"
        owner: "{{ tv_user }}"
        group: "{{ tv_user }}"
        mode: "0644"
        content: |
          <settings version="2">
          {% for line in pm4k_lines %}
              {{ line }}
          {% endfor %}
          </settings>
      when: pm4k_settings_raw.content is not defined

    - name: Start Kodi
      become_user: "{{ tv_user }}"
      environment: "{{ tv_env }}"
      ansible.builtin.systemd_service:
        name: kodi.service
        scope: user
        state: started
