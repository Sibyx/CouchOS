# One AirPlay receiver at a time (airplay_receiver in group_vars): both would
# answer on port 7000 as the same device.

- name: UxPlay AirPlay receiver
  ansible.builtin.import_tasks: uxplay.yml
  when: airplay_receiver == 'uxplay'

- name: Stop UxPlay (Kodi's AirPlay add-on is the receiver)
  when: airplay_receiver != 'uxplay'
  become_user: "{{ tv_user }}"
  environment: "{{ tv_env }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: false
    state: stopped
  loop: [uxplay.service, airplay-bridge.service]
  failed_when: false
