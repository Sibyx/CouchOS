- name: Install Kodi (Raspberry Pi archive build)
  ansible.builtin.apt:
    name: "{{ kodi_package }}"
    state: present
    install_recommends: false

- name: Keep the login prompt off the TV (Kodi owns the screen)
  ansible.builtin.systemd_service:
    name: getty@tty1.service
    enabled: false
    state: stopped

- name: First-run settings (only if Kodi has no settings yet)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ tv_home }}/.kodi/userdata/{{ item }}"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    force: false
  loop: [guisettings.xml, sources.xml]

- name: Advanced settings
  ansible.builtin.template:
    src: advancedsettings.xml.j2
    dest: "{{ tv_home }}/.kodi/userdata/advancedsettings.xml"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart kodi

- name: CouchOS Kodi add-on
  ansible.builtin.copy:
    src: service.couchos/
    dest: "{{ tv_home }}/.kodi/addons/service.couchos/"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart kodi

# Superseded by PM4K's kiosk mode (below); two launchers raced each other.
- name: Remove the old CouchOS autostart
  ansible.builtin.file:
    path: "{{ tv_home }}/.kodi/addons/service.couchos/service.py"
    state: absent
  notify: Restart kodi

- name: Add-on installer
  ansible.builtin.copy:
    src: kodi-addons.py
    dest: /usr/local/libexec/couchos/
    mode: "0755"

- name: Install PM4K and its dependencies
  become_user: "{{ tv_user }}"
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/couchos/kodi-addons.py
      - install
      - --addons-dir={{ tv_home }}/.kodi/addons
      - --repo={{ kodi_addon_repo }}
      - --pm4k-ref={{ pm4k_ref }}
  register: pm4k_install
  changed_when: (pm4k_install.stdout | from_json).changed
  notify: Restart kodi

- name: Kodi user service
  ansible.builtin.template:
    src: kodi.service.j2
    dest: "{{ tv_home }}/.config/systemd/user/kodi.service"
    owner: "{{ tv_user }}"
    group: "{{ tv_user }}"
    mode: "0644"
  notify: Restart kodi

- name: Start Kodi
  become_user: "{{ tv_user }}"
  environment: "{{ tv_env }}"
  ansible.builtin.systemd_service:
    name: kodi.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started

- name: Apply pending Kodi restarts before enabling add-ons
  ansible.builtin.meta: flush_handlers

- name: Enable PM4K, its dependencies and the CouchOS add-on
  become_user: "{{ tv_user }}"
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/couchos/kodi-addons.py
      - enable
      - --addons-dir={{ tv_home }}/.kodi/addons
      - --jsonrpc=http://127.0.0.1:{{ kodi_webserver_port }}/jsonrpc
      - --extra
      - service.couchos
  register: pm4k_enable
  changed_when: (pm4k_enable.stdout | from_json).changed

# PM4K's "Start Plex On Kodi Startup" (kiosk.mode): Plex opens at boot and
# owns the screen. The file also holds the Plex sign-in, so merge one line
# instead of templating it, and only while Kodi is stopped (Kodi rewrites the
# file on exit).
- name: Read PM4K settings
  ansible.builtin.slurp:
    src: "{{ pm4k_settings }}"
  register: pm4k_settings_raw
  failed_when: false

- name: Turn on PM4K kiosk mode
  when: >-
    pm4k_settings_raw.content is not defined or
    '<setting id="kiosk.mode">true</setting>' not in (pm4k_settings_raw.content | b64decode)
  block:
    - name: Stop Kodi while editing its settings
      become_user: "{{ tv_user }}"
      environment: "{{ tv_env }}"
      ansible.builtin.systemd_service:
        name: kodi.service
        scope: user
        state: stopped

    - name: Merge kiosk.mode into PM4K settings
      ansible.builtin.lineinfile:
        path: "{{ pm4k_settings }}"
        regexp: '^\s*<setting id="kiosk\.mode"'
        line: '    <setting id="kiosk.mode">true</setting>'
        insertbefore: '^</settings>'
      when: pm4k_settings_raw.content is defined

    - name: Create PM4K settings with kiosk.mode
      ansible.builtin.copy:
        dest: "{{ pm4k_settings }}"
        owner: "{{ tv_user }}"
        group: "{{ tv_user }}"
        mode: "0644"
        content: |
          <settings version="2">
              <setting id="kiosk.mode">true</setting>
          </settings>
      when: pm4k_settings_raw.content is not defined

    - name: Start Kodi
      become_user: "{{ tv_user }}"
      environment: "{{ tv_env }}"
      ansible.builtin.systemd_service:
        name: kodi.service
        scope: user
        state: started
