- name: Refresh apt cache (the image ships without lists)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base tools
  ansible.builtin.apt:
    # acl: lets Ansible become the unprivileged media user
    name: [acl, hd-idle, jq]
    state: present
    install_recommends: false

# Same file the image ships, so a running Pi gets config.txt fixes too.
# The boot partition is FAT: no backup (Ansible's backup name has ':' in it)
# and no mode (FAT has no permissions).
- name: Firmware config (config.txt)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/stage-couchos/03-boot/files/config.txt"
    dest: /boot/firmware/config.txt
  register: firmware_config

- name: Firmware config needs a reboot
  ansible.builtin.debug:
    msg: "config.txt changed: reboot the Pi to apply it (sudo systemctl reboot)."
  when: firmware_config.changed

# The journal otherwise grows to 10 % of the SD card.
- name: Journal drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap the systemd journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-couchos.conf
    content: |
      [Journal]
      SystemMaxUse={{ journal_max_use }}
      SystemKeepFree=1G
    mode: "0644"
  register: journald_conf

- name: Apply the journal cap
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: journald_conf.changed

# Downloaded .deb files are never needed again once installed.
- name: Drop cached packages
  ansible.builtin.apt:
    autoclean: true
    clean: true

# The router hands out a global IPv6 address but routes nothing out over v6:
# connects to dual-stack hosts (discover.provider.plex.tv) hang ~6 s per
# attempt. PM4K's connector does not fall back to IPv4 in time, which stalled
# its home screen. Resolve IPv4 first; IPv6 still works on the LAN (mDNS).
- name: Prefer IPv4 for outgoing connections
  ansible.builtin.copy:
    dest: /etc/gai.conf
    content: |
      # CouchOS (Ansible): IPv4 first, see roles/base.
      precedence ::ffff:0:0/96  100
    mode: "0644"

- name: Kernel and network tunables
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-couchos.conf
    reload: true
  loop:
    # rpi-swap sets up zram; swapping to compressed RAM is cheap, so prefer it
    # over evicting Kodi's page cache.
    - { name: vm.swappiness, value: "100" }
    # Rootless podman (web UI as the tv user) binds port 80.
    - { name: net.ipv4.ip_unprivileged_port_start, value: "{{ web_port }}" }
